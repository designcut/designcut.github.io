<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesignCut</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="theme-wrapper">
    <header>
      <h1>DesignCut</h1>
      <nav>
        <a href="#men">Men</a>
        <a href="#women">Women</a>
      </nav>
      <div class="theme-toggle">
        <input type="radio" id="light" name="theme" checked>
        <label for="light">Light</label>
        <input type="radio" id="dark" name="theme">
        <label for="dark">Dark</label>
        <input type="radio" id="white" name="theme">
        <label for="white">White</label>
      </div>
    </header>
    <main>
      <section id="men">
        <h2>Men</h2>
        <div class="product-grid">
          <div class="product-card">
            <img src="img/men1.jpg" alt="Men's Shirt">
            <h3>Casual Shirt</h3>
            <p>$45</p>
          </div>
          <div class="product-card">
            <img src="img/men2.jpg" alt="Men's Jacket">
            <h3>Leather Jacket</h3>
            <p>$120</p>
          </div>
          <div class="product-card">
            <img src="img/men3.jpg" alt="Men's Pants">
            <h3>Chinos</h3>
            <p>$60</p>
          </div>
          <div class="product-card">
            <img src="img/men4.jpg" alt="Men's Sneakers">
            <h3>Sneakers</h3>
            <p>$80</p>
          </div>
          <div class="product-card">
            <img src="img/men5.jpg" alt="Men's Hoodie">
            <h3>Hoodie</h3>
            <p>$55</p>
          </div>
          <div class="product-card">
            <img src="img/men6.jpg" alt="Men's Watch">
            <h3>Watch</h3>
            <p>$150</p>
          </div>
        </div>
      </section>
      <section id="women">
        <h2>Women</h2>
        <div class="product-grid">
          <div class="product-card">
            <img src="img/women1.jpg" alt="Women's Dress">
            <h3>Summer Dress</h3>
            <p>$70</p>
          </div>
          <div class="product-card">
            <img src="img/women2.jpg" alt="Women's Blouse">
            <h3>Blouse</h3>
            <p>$40</p>
          </div>
          <div class="product-card">
            <img src="img/women3.jpg" alt="Women's Skirt">
            <h3>Skirt</h3>
            <p>$50</p>
          </div>
          <div class="product-card">
            <img src="img/women4.jpg" alt="Women's Heels">
            <h3>Heels</h3>
            <p>$90</p>
          </div>
          <div class="product-card">
            <img src="img/women5.jpg" alt="Women's Jacket">
            <h3>Denim Jacket</h3>
            <p>$85</p>
          </div>
          <div class="product-card">
            <img src="img/women6.jpg" alt="Women's Bag">
            <h3>Handbag</h3>
            <p>$110</p>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
