<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Fashion E-Commerce</h1>
    </header>
    
    <nav>
        <button id="men-btn">Men</button>
        <button id="women-btn">Women</button>
        <button id="recently-viewed-btn">Recently Viewed</button>
        <button id="recommended-btn">Recommended</button>
    </nav>
    
    <section id="themes">
        <h2>Choose Theme</h2>
        <label><input type="radio" name="theme" value="default" checked> Default</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
        <label><input type="radio" name="theme" value="white"> White</label>
    </section>
    
    <section id="colors">
        <h2>Customize Colors</h2>
        <label><input type="radio" name="color" value="red" checked> Red</label>
        <label><input type="radio" name="color" value="blue"> Blue</label>
        <label><input type="radio" name="color" value="green"> Green</label>
        <label><input type="radio" name="color" value="pink"> Pink</label>
    </section>
    
    <section id="men">
        <h2>Men's Fashion</h2>
        <img src="images/product1.jpg" alt="Men's Product 1">
        <p>Explore men's latest trends.</p>
    </section>
    
    <section id="women">
        <h2>Women's Fashion</h2>
        <img src="images/product2.jpg" alt="Women's Product 1">
        <p>Discover women's stylish collections.</p>
    </section>
    
    <section id="recently-viewed">
        <h2>Recently Viewed</h2>
        <img src="images/product3.jpg" alt="Recently Viewed Product">
        <p>Your recent picks.</p>
    </section>
    
    <section id="recommended">
        <h2>Recommended</h2>
        <img src="images/product1.jpg" alt="Recommended Product">
        <p>Curated for you.</p>
    </section>
    
    <script src="script.js"></script>
</body>
</html>v
