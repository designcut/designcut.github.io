<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignCut - Fashion E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="brand">DesignCut</div>
        <nav>
            <a href="#men" class="nav-link">Men</a>
            <a href="#women" class="nav-link">Women</a>
            <div class="theme-switcher">
                <label for="theme-select">Theme:</label>
                <select id="theme-select">
                    <option value="light">Light (Pink)</option>
                    <option value="dark">Dark</option>
                    <option value="white">White</option>
                </select>
            </div>
        </nav>
    </header>

    <main>
        <section id="men">
            <h2>Men's Collection</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="img/men1.jpg" alt="Men's Product 1">
                    <h3>Classic Shirt</h3>
                    <p class="price">$49.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/men2.jpg" alt="Men's Product 2">
                    <h3>Denim Jacket</h3>
                    <p class="price">$79.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/men3.jpg" alt="Men's Product 3">
                    <h3>Casual Pants</h3>
                    <p class="price">$59.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/men4.jpg" alt="Men's Product 4">
                    <h3>Formal Suit</h3>
                    <p class="price">$199.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/men5.jpg" alt="Men's Product 5">
                    <h3>Sneakers</h3>
                    <p class="price">$89.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/men6.jpg" alt="Men's Product 6">
                    <h3>Leather Belt</h3>
                    <p class="price">$29.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
            </div>
        </section>

        <section id="women">
            <h2>Women's Collection</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="img/women1.jpg" alt="Women's Product 1">
                    <h3>Elegant Dress</h3>
                    <p class="price">$69.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/women2.jpg" alt="Women's Product 2">
                    <h3>Blouse</h3>
                    <p class="price">$39.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/women3.jpg" alt="Women's Product 3">
                    <h3>Skirt</h3>
                    <p class="price">$49.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/women4.jpg" alt="Women's Product 4">
                    <h3>High Heels</h3>
                    <p class="price">$99.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/women5.jpg" alt="Women's Product 5">
                    <h3>Jacket</h3>
                    <p class="price">$79.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="img/women6.jpg" alt="Women's Product 6">
                    <h3>Handbag</h3>
                    <p class="price">$59.99</p>
                    <button class="buy-btn">Buy Now</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
